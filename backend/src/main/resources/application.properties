spring.application.name=tradematrix-backend
server.port=8080

# Development-only JWT secret. Replace with an environment variable before production.
tradematrix.jwt.secret=TradeMatrixDevelopmentSecretChangeBeforeProduction123456
tradematrix.jwt.expiration-ms=86400000

# Set GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET in PowerShell before starting the backend.

